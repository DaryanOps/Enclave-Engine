[package]
name = "search-engine"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "search-engine"
path = "src/main.rs"

[dependencies]
# ── Web framework ─────────────────────────────────────────────────────────────
axum        = { version = "0.7",  features = ["json"] }
tokio       = { version = "1",    features = ["full"] }
tower-http  = { version = "0.5",  features = ["cors", "trace"] }

# ── Serialisation ─────────────────────────────────────────────────────────────
serde       = { version = "1",    features = ["derive"] }
serde_json  = "1"
bincode     = "1"

# ── String similarity (Levenshtein for QueryPreprocessor) ─────────────────────
strsim      = "0.11"

# ── System metrics (RSS memory for /health) ──────────────────────────────────
sysinfo     = "0.30"

# ── Utilities ─────────────────────────────────────────────────────────────────
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot        = "0.12"
anyhow             = "1"
thiserror          = "1"
once_cell          = "1"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
