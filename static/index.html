<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Enclave Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet" />
<style>
:root {
  --navy-950: #050810;
  --navy-900: #080d1a;
  --navy-800: #0c1424;
  --navy-700: #111d35;
  --navy-600: #172446;
  --border:   #1c2e50;
  --border-hi:#243d6e;
  --blue:     #3b82f6;
  --blue-dim: #1d4ed8;
  --blue-glow:rgba(59,130,246,0.15);
  --blue-faint:rgba(59,130,246,0.07);
  --text:     #cbd5e1;
  --text-dim: #64748b;
  --text-faint:#2d3f5c;
  --green:    #34d399;
  --red:      #f87171;
  --cyan:     #67e8f9;
  --font:     'Outfit', sans-serif;
  --font-head:'DM Serif Display', serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{background:var(--navy-950);color:var(--text);font-family:var(--font);font-weight:400;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(var(--navy-800) 1px,transparent 1px),linear-gradient(90deg,var(--navy-800) 1px,transparent 1px);
  background-size:48px 48px;opacity:0.2;z-index:0}
.ambient{position:fixed;top:22%;left:50%;transform:translateX(-50%);width:900px;height:450px;
  background:radial-gradient(ellipse at center,rgba(59,130,246,0.06) 0%,transparent 70%);pointer-events:none;z-index:0}
.shell{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:0 1.5rem 8rem}

/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 0;border-bottom:1px solid var(--border);margin-bottom:5rem}
.wordmark{font-family:var(--font-head);font-size:1.05rem;color:var(--text);letter-spacing:0.01em}
.wordmark span{color:var(--blue)}
.topbar-right{display:flex;align-items:center;gap:1.5rem}
.ram-chip{display:flex;align-items:center;gap:0.45rem;font-size:0.7rem;font-weight:500;letter-spacing:0.04em;color:var(--text-dim)}
.ram-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:breathe 2.5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1;box-shadow:0 0 4px var(--green)}50%{opacity:0.4;box-shadow:none}}
.topbar-stat{font-size:0.7rem;color:var(--text-faint)}
.topbar-stat b{color:var(--text-dim);font-weight:500}

/* Hero */
.hero{text-align:center;margin-bottom:3rem}
.hero-title{font-family:var(--font-head);font-size:clamp(2.4rem,6vw,3.6rem);color:var(--text);letter-spacing:-0.01em;line-height:1.1;margin-bottom:0.4rem}
.hero-title span{color:var(--blue);position:relative}
.hero-title span::after{content:'';position:absolute;left:0;right:0;bottom:-3px;height:1px;background:linear-gradient(90deg,transparent,var(--blue),transparent);opacity:0.4}

/* Search bar */
.search-wrap{position:relative;margin-bottom:2.5rem}
.search-frame{display:flex;align-items:stretch;background:var(--navy-800);border:1px solid var(--border-hi);transition:border-color 0.2s,box-shadow 0.2s}
.search-frame:focus-within{border-color:var(--blue-dim);box-shadow:0 0 0 3px var(--blue-faint),0 0 40px rgba(59,130,246,0.07)}
.search-input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:var(--font);font-size:0.95rem;padding:1rem 1.2rem;caret-color:var(--blue)}
.search-input::placeholder{color:var(--text-faint)}
.search-btn{padding:0 1.8rem;background:var(--blue-dim);border:none;border-left:1px solid var(--border);color:#fff;font-family:var(--font);font-size:0.8rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;transition:background 0.15s}
.search-btn:hover{background:var(--blue)}
.search-btn:disabled{opacity:0.5;cursor:default}

/* Autocomplete */
#autocomplete{display:none;position:absolute;top:100%;left:0;right:0;z-index:50;background:var(--navy-800);border:1px solid var(--border-hi);border-top:none;overflow:hidden}
.ac-item{display:flex;justify-content:space-between;align-items:center;padding:0.55rem 1.2rem;font-size:0.82rem;color:var(--text-dim);cursor:pointer;transition:background 0.1s,color 0.1s}
.ac-item:hover,.ac-item.active{background:var(--navy-700);color:var(--text)}
.ac-weight{font-size:0.62rem;color:var(--text-faint)}

/* Meta row */
#meta-row{display:none;align-items:center;justify-content:space-between;margin-bottom:1.5rem;font-size:0.72rem;color:var(--text-dim)}
.latency-pill{display:inline-flex;align-items:center;gap:0.4rem;padding:0.22rem 0.7rem;border-radius:2px;font-size:0.68rem;font-weight:600;letter-spacing:0.03em;transition:background 0.3s,border-color 0.3s,color 0.3s}
.latency-pill.fast{background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.2);color:var(--green)}
.latency-pill.slow{background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.2);color:var(--red)}
.lat-dot{width:5px;height:5px;border-radius:50%;background:currentColor;animation:breathe 1.8s ease-in-out infinite}
.latency-pill.slow .lat-dot{animation:none}

/* Notices */
#notices{display:none;flex-direction:column;gap:0.5rem;margin-bottom:1.5rem}
.notice{padding:0.55rem 1rem;font-size:0.72rem;border-left:2px solid;line-height:1.5}
.notice-typo{border-color:var(--blue-dim);background:var(--blue-faint);color:#93c5fd}
.notice strong{font-weight:600;color:var(--blue)}

/* Spinner */
#spinner{display:none;padding:4rem 0;text-align:center}
.spin-ring{display:inline-block;width:26px;height:26px;border:1.5px solid var(--border-hi);border-top-color:var(--blue);border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Results */
#results{display:flex;flex-direction:column}
.result-card{padding:1.4rem 0;border-bottom:1px solid var(--border);animation:fadeUp 0.2s ease both}
.result-card:first-child{border-top:1px solid var(--border)}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.result-card:nth-child(1){animation-delay:0.00s}
.result-card:nth-child(2){animation-delay:0.05s}
.result-card:nth-child(3){animation-delay:0.10s}
.result-card:nth-child(4){animation-delay:0.15s}
.result-card:nth-child(5){animation-delay:0.20s}
.result-card:nth-child(6){animation-delay:0.25s}
.result-card:nth-child(7){animation-delay:0.30s}
.result-card:nth-child(8){animation-delay:0.35s}
.result-title{font-family:var(--font-head);font-size:1.05rem;color:var(--text);margin-bottom:0.5rem;line-height:1.3}
.result-snippet{font-size:0.8rem;line-height:1.75;color:var(--text-dim);margin-bottom:0.5rem}
.result-snippet mark{background:var(--blue-glow);color:#93c5fd;font-weight:500;padding:0 2px;border-radius:2px}
.result-meta{font-size:0.65rem;color:var(--text-faint);display:flex;gap:1rem}
.state-msg{padding:4rem 0;text-align:center;color:var(--text-faint);font-size:0.82rem;line-height:1.6}
.state-icon{font-size:2rem;margin-bottom:1rem;opacity:0.15}

/* Index panel */
.index-section{margin-top:4rem;border-top:1px solid var(--border);padding-top:1.5rem}
.index-toggle{display:flex;align-items:center;gap:0.6rem;font-size:0.73rem;font-weight:500;color:var(--text-faint);cursor:pointer;letter-spacing:0.05em;text-transform:uppercase;background:none;border:none;padding:0;transition:color 0.15s}
.index-toggle:hover{color:var(--text-dim)}
.toggle-icon{font-size:0.5rem;color:var(--blue);transition:transform 0.2s}
.toggle-icon.open{transform:rotate(90deg)}
.index-form{display:none;flex-direction:column;gap:1rem;margin-top:1.25rem}
.index-form.open{display:flex}
.field-label{font-size:0.65rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-faint);margin-bottom:0.35rem}
.field-input,.field-textarea{width:100%;background:var(--navy-800);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:0.82rem;padding:0.65rem 0.9rem;outline:none;transition:border-color 0.15s;resize:vertical}
.field-input:focus,.field-textarea:focus{border-color:var(--blue-dim)}
.field-textarea{min-height:80px}
.index-submit{align-self:flex-start;padding:0.6rem 1.5rem;background:var(--blue-faint);border:1px solid var(--blue-dim);color:#93c5fd;font-family:var(--font);font-size:0.75rem;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;cursor:pointer;transition:background 0.15s,color 0.15s}
.index-submit:hover{background:var(--blue-dim);color:#fff}
#index-status{font-size:0.72rem;min-height:1em;color:var(--green)}

/* Health grid */
.health-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);margin-top:3rem}
.health-cell{background:var(--navy-900);padding:1.1rem 1rem}
.health-label{font-size:0.62rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-faint);margin-bottom:0.4rem}
.health-value{font-family:var(--font-head);font-size:1.5rem;color:var(--text);line-height:1;margin-bottom:0.2rem}
.health-unit{font-size:0.62rem;color:var(--text-faint)}
.health-value.blue{color:var(--blue)}
.health-value.green{color:var(--green)}
.health-value.cyan{color:var(--cyan)}
footer{margin-top:3rem;padding-top:1.5rem;border-top:1px solid var(--border);font-size:0.65rem;color:var(--text-faint);text-align:center;letter-spacing:0.04em}
@media(max-width:600px){.health-grid{grid-template-columns:repeat(2,1fr)}.hero-title{font-size:2rem}.topbar-stat{display:none}}
</style>
</head>
<body>

<div class="ambient"></div>
<div class="shell">

  <header class="topbar">
    <div class="wordmark">Enclave <span>Engine</span></div>
    <div class="topbar-right">
      <div class="ram-chip">
        <span class="ram-dot"></span>
        <span id="ram-val">— MB</span>
      </div>
      <div class="topbar-stat">
        <b id="bar-docs">—</b> docs · <b id="bar-vocab">—</b> terms
      </div>
    </div>
  </header>

  <div class="hero">
    <h1 class="hero-title">Enclave <span>Engine</span></h1>
  </div>

  <div class="search-wrap">
    <div class="search-frame">
      <input id="search-input" class="search-input" type="text"
        placeholder="Search documents…" autocomplete="off" spellcheck="false" />
      <button class="search-btn" id="search-btn">Search</button>
    </div>
    <div id="autocomplete"></div>
  </div>

  <div id="notices"></div>

  <div id="meta-row">
    <span id="result-count"></span>
    <div class="latency-pill fast" id="latency-pill">
      <span class="lat-dot"></span>
      <span id="lat-val">—</span>
    </div>
  </div>

  <div id="spinner"><div class="spin-ring"></div></div>

  <div id="results">
    <div class="state-msg">
      <div class="state-icon">◎</div>
      Enter a query to search the index
    </div>
  </div>

  <div class="index-section">
    <button class="index-toggle" id="idx-toggle">
      <span class="toggle-icon" id="toggle-icon">▶</span>
      Add document to index
    </button>
    <div class="index-form" id="idx-form">
      <div>
        <div class="field-label">Title</div>
        <input class="field-input" id="idx-title" type="text" placeholder="Document title" />
      </div>
      <div>
        <div class="field-label">Body</div>
        <textarea class="field-textarea" id="idx-body" placeholder="Document content"></textarea>
      </div>
      <button class="index-submit" id="idx-btn">Index Document</button>
      <div id="index-status"></div>
    </div>
  </div>

  <div class="health-grid">
    <div class="health-cell">
      <div class="health-label">Memory</div>
      <div class="health-value green" id="h-rss">—</div>
      <div class="health-unit">MB resident</div>
    </div>
    <div class="health-cell">
      <div class="health-label">p50 Latency</div>
      <div class="health-value cyan" id="h-p50">—</div>
      <div class="health-unit">microseconds</div>
    </div>
    <div class="health-cell">
      <div class="health-label">Documents</div>
      <div class="health-value blue" id="h-docs">—</div>
      <div class="health-unit">indexed</div>
    </div>
    <div class="health-cell">
      <div class="health-label">Vocabulary</div>
      <div class="health-value blue" id="h-vocab">—</div>
      <div class="health-unit">unique stems</div>
    </div>
  </div>

  <footer>Enclave Engine — built in Rust</footer>
</div>

<script>
const API = '';
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// Always-on config — never shown to user
const SEARCH_CONFIG = { typo_tolerance: true, semantic_blend: 0.4 };

// ── Health / stats ────────────────────────────────────────────────
async function pollHealth() {
  try {
    const d = await fetch(`${API}/api/health`).then(r=>r.json());
    $('ram-val').textContent = d.rss_mb.toFixed(1)+' MB';
    $('h-rss').textContent   = d.rss_mb.toFixed(1);
    $('h-p50').textContent   = d.p50_latency_us.toLocaleString();
    $('h-docs').textContent  = d.total_docs.toLocaleString();
    $('h-vocab').textContent = d.vocab_size.toLocaleString();
  } catch {}
}

async function pollStats() {
  try {
    const d = await fetch(`${API}/api/stats`).then(r=>r.json());
    $('bar-docs').textContent  = d.total_docs.toLocaleString();
    $('bar-vocab').textContent = d.vocab_size.toLocaleString();
  } catch {}
}

pollHealth(); pollStats();
setInterval(pollHealth, 5000);

// ── Autocomplete (title-only, from backend) ───────────────────────
let acTimer = null, acActive = -1;
const acEl = $('autocomplete');

$('search-input').addEventListener('input', e => {
  clearTimeout(acTimer);
  const last = e.target.value.trim().split(/\s+/).pop() || '';
  if (last.length < 2) { hideAc(); return; }
  acTimer = setTimeout(() => fetchSuggest(last), 160);
});

$('search-input').addEventListener('keydown', e => {
  const items = acEl.querySelectorAll('.ac-item');
  if (e.key==='ArrowDown'){e.preventDefault();acActive=Math.min(acActive+1,items.length-1);updAc(items)}
  else if(e.key==='ArrowUp'){e.preventDefault();acActive=Math.max(acActive-1,-1);updAc(items)}
  else if(e.key==='Enter'){if(acActive>=0&&items[acActive])applyAc(items[acActive].dataset.term);else{hideAc();doSearch()}}
  else if(e.key==='Escape')hideAc();
});

function updAc(items){items.forEach((el,i)=>el.classList.toggle('active',i===acActive))}

async function fetchSuggest(prefix){
  try {
    const d = await fetch(`${API}/api/suggest?q=${encodeURIComponent(prefix)}&limit=6`).then(r=>r.json());
    if(!d.suggestions.length){hideAc();return}
    acEl.innerHTML = d.suggestions.map(s=>`
      <div class="ac-item" data-term="${esc(s.term)}">
        <span>${esc(s.term)}</span>
        <span class="ac-weight">${s.weight}</span>
      </div>`).join('');
    acEl.style.display='block'; acActive=-1;
    acEl.querySelectorAll('.ac-item').forEach(el=>el.addEventListener('click',()=>applyAc(el.dataset.term)));
  } catch{hideAc()}
}

function applyAc(term){
  const inp=($('search-input'));
  const words=inp.value.split(/\s+/);
  words[words.length-1]=term;
  inp.value=words.join(' ')+' ';
  hideAc(); inp.focus();
}

function hideAc(){acEl.style.display='none';acEl.innerHTML='';acActive=-1}
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))hideAc()});

// ── Search ────────────────────────────────────────────────────────
$('search-btn').addEventListener('click',()=>{hideAc();doSearch()});

async function doSearch(){
  const q=$('search-input').value.trim();
  if(!q)return;

  $('results').innerHTML='';
  $('notices').innerHTML='';
  $('notices').style.display='none';
  $('meta-row').style.display='none';
  $('spinner').style.display='block';
  $('search-btn').disabled=true;

  try{
    const r=await fetch(`${API}/api/search`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({query:q,limit:10,...SEARCH_CONFIG}),
    });
    const data=await r.json();

    $('spinner').style.display='none';
    $('meta-row').style.display='flex';

    // Latency — green ≤ 30ms, red > 30ms
    const ms=data.latency_ms;
    const pill=$('latency-pill');
    $('lat-val').textContent=ms.toFixed(3)+' ms';
    if(ms>30){pill.className='latency-pill slow'}
    else     {pill.className='latency-pill fast'}

    $('result-count').textContent=`${data.total_results} result${data.total_results!==1?'s':''}`;

    // Only show typo correction notice (not synonym noise)
    if(data.corrections?.length){
      $('notices').innerHTML=`<div class="notice notice-typo">
        Showing results for
        ${data.corrections.map(([,c])=>`<strong>${esc(c)}</strong>`).join(', ')}
        — corrected from <em>${esc(q)}</em>
      </div>`;
      $('notices').style.display='flex';
    }

    if(!data.results.length){
      $('results').innerHTML=`<div class="state-msg">
        <div class="state-icon">◎</div>
        No results found for &ldquo;${esc(q)}&rdquo;
      </div>`;
      return;
    }

    $('results').innerHTML=data.results.map((res,i)=>`
      <div class="result-card">
        <div class="result-title">${esc(res.title)}</div>
        <div class="result-snippet">${res.snippet}</div>
        <div class="result-meta">
          <span>#${i+1}</span>
          <span>doc ${res.doc_id}</span>
        </div>
      </div>`).join('');

  }catch(err){
    $('spinner').style.display='none';
    $('results').innerHTML=`<div class="state-msg">
      <div class="state-icon" style="color:var(--red)">⚠</div>
      Could not reach the server.<br>Make sure Rust is running on port 8080.
    </div>`;
  }finally{
    $('search-btn').disabled=false;
    pollHealth(); pollStats();
  }
}

// ── Index panel ───────────────────────────────────────────────────
$('idx-toggle').addEventListener('click',()=>{
  const open=$('idx-form').classList.toggle('open');
  $('toggle-icon').classList.toggle('open',open);
});

$('idx-btn').addEventListener('click',async()=>{
  const title=$('idx-title').value.trim();
  const body=$('idx-body').value.trim();
  const st=$('index-status');
  if(!title||!body){st.style.color='var(--red)';st.textContent='Both fields required.';return}
  st.style.color='var(--text-dim)';st.textContent='Indexing…';
  try{
    const d=await fetch(`${API}/api/index`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({title,body})}).then(r=>r.json());
    st.style.color='var(--green)';st.textContent=`Document ${d.doc_id} indexed.`;
    $('idx-title').value='';$('idx-body').value='';
    pollStats();pollHealth();
  }catch{st.style.color='var(--red)';st.textContent='Indexing failed.'}
});
</script>
</body>
</html>
